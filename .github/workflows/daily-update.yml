# Daily refresh of FCI series → data.json
# CAFCI typically publishes evening ART; cron ~00:30 UTC ≈ 21:30 ART previous calendar day,
# plus a morning catch-up.
#
# Nerdo: enable GitHub Pages (deploy from branch `main` / root) after first green run.
# Needs `contents: write` to commit data.json back to main.

name: daily-fci-update

on:
  schedule:
    - cron: "30 0 * * 1-5"   # 00:30 UTC weekdays (~21:30 ART prev evening window)
    - cron: "30 11 * * 1-5"  # 11:30 UTC weekdays (~08:30 ART morning catch-up)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch series and write data.json
        run: python scripts/fetch_data.py --out data.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh FCI series $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
